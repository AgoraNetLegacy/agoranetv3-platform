name: Bug report
description: Report reproducible behavior that is not working as intended.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, access keys, wallet seed phrases, personal data,
        or production database content. Security vulnerabilities belong in the
        private reporting path described in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the behavior and the impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, device, local/staging/production, and relevant version or commit.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: This report does not contain secrets, private data, or a security vulnerability.
          required: true
